spring.application.name=EventBooking
spring.config.import=optional:file:.env[.properties]

# --- Server ---
server.port=8080

# --- Database (Postgres) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/event_management
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Use a long random string in production (32+ bytes). Do not commit real secrets.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=7200000

# --- Email Configuration ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Payment Gateways ---
payment.khalti.secret-key=${KHALTI_SECRET_KEY}
payment.esewa.secret-key=${ESEWA_SECRET_KEY}


# --- CORS ---
# React dev server default ports (CRA: 3000, Vite: 5173)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html