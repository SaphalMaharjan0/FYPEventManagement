spring.application.name=EventBooking

# --- Server ---
server.port=8080

# --- Database (Postgres) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/event_management
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Use a long random string in production (32+ bytes). Do not commit real secrets.
app.jwt.secret=replace_this_with_a_long_random_base64_secret_key_before_running
app.jwt.expiration-ms=86400000

# --- CORS ---
# React dev server default ports (CRA: 3000, Vite: 5173)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html